<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Keystone Lake AR Map</title>

    <!-- A-Frame and MindAR must load before any <a-scene> is parsed -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ===== START SCREEN ===== -->
    <div id="overlay">
        <button id="startButton">Start AR Experience</button>
        <div id="instructions">
            Point your camera at the Keystone Lake map to show areas to visit!<br>
            Bring your camera in close up to the marked areas to show more info about them.
        </div>
        <div id="loadingMsg">⏳ Starting camera, please wait…</div>
        <div id="errorMsg"></div>
    </div>


    <!-- ===== LOCATION PICKER (for markers that cover several locations) ===== -->
    <div id="pickerOverlay" class="fullOverlay modal-bg">
        <div class="modal-box">
            <h2 id="pickerTitle">Select a Location</h2>
            <p>Which area would you like to explore?</p>
            <div id="pickerBtns" class="btn-row"></div>
            <button id="pickerBack" class="btn btn-back">✕ Stay Here</button>
        </div>
    </div>


    <!-- ===== ACTION MENU (360° photo / video / website) ===== -->
    <div id="actionOverlay" class="fullOverlay modal-bg">
        <div class="modal-box">
            <h2 id="actionTitle"></h2>
            <p>What would you like to do?</p>
            <div id="actionBtns" class="btn-row"></div>
            <button id="actionBack" class="btn btn-back">← Back</button>
        </div>
    </div>


    <!-- ===== 360° PANORAMA VIEW =====
         Hidden with visibility (not display) so the embedded scene's
         WebGL canvas is created at full size. The sky has no src here;
         script.js sets it each time a photo is opened. -->
    <div id="panoramaContainer">
        <a-scene id="panoramaScene"
            embedded
            vr-mode-ui="enabled: false"
            device-orientation-permission-ui="enabled: false"
            renderer="colorManagement: false;">
            <a-sky id="panoramaSky" rotation="0 -90 0"></a-sky>
            <a-camera look-controls="enabled: true; touchEnabled: true;"
                      wasd-controls="enabled: false"
                      position="0 0 0">
            </a-camera>
        </a-scene>

        <div id="panoBar">
            <button class="pano-nav-btn" id="prevPano">&#8592;</button>
            <span id="panoLabel">Location</span>
            <span id="panoCounter"></span>
            <button class="pano-nav-btn" id="nextPano">&#8594;</button>
            <span class="pano-divider">|</span>
            <button id="exitPanorama">← Back to AR</button>
        </div>
    </div>


    <!-- ===== VIDEO VIEW ===== -->
    <div id="videoContainer">
        <button id="exitVideo">← Back to AR</button>
        <video id="locationVideo" controls playsinline preload="none"></video>
    </div>


    <!-- ===== MAIN AR SCENE =====
         .mind file target order:
           0 — main map poster
           1 — Feyodi Creek        (top-left)
           2 — Cowskin Bay         (top-left, lower/right)
           3 — Walnut Creek        (top-right)
           4 — Appalachia/Wash.Irv (just right of center)
           5 — New Mannford        (bottom-center)
           6 — Keystone/WW/Brush   (bottom-right) -->
    <a-scene id="arScene"
        mindar-image="imageTargetSrc: map_targets.mind;
                      autoStart: false;
                      filterMinCF: 0.0001; filterBeta: 0.001;
                      warmupTolerance: 5; missTolerance: 5;"
        vr-mode-ui="enabled: false;"
        device-orientation-permission-ui="enabled: false"
        renderer="colorManagement: false; logarithmicDepthBuffer: true;">

        <a-assets>
            <img id="markerImage" src="assets/marker.png" crossorigin="anonymous">
        </a-assets>

        <!-- Pulsing markers drawn over the full map poster -->
        <a-entity mindar-image-target="targetIndex: 0">

            <!-- Feyodi Creek -->
            <a-image src="#markerImage" position="-0.40 0.30 0.03"
                width="0.12" height="0.12" material="shader: flat;"
                animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true">
            </a-image>

            <!-- Cowskin Bay -->
            <a-image src="#markerImage" position="-0.18 0.10 0.03"
                width="0.12" height="0.12" material="shader: flat;"
                animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true">
            </a-image>

            <!-- Walnut Creek -->
            <a-image src="#markerImage" position="0.22 0.18 0.03"
                width="0.12" height="0.12" material="shader: flat;"
                animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true">
            </a-image>

            <!-- Appalachia Bay / Washington Irving -->
            <a-image src="#markerImage" position="0.22 -0.10 0.03"
                width="0.12" height="0.12" material="shader: flat;"
                animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true">
            </a-image>

            <!-- New Mannford -->
            <a-image src="#markerImage" position="0.00 -0.42 0.03"
                width="0.12" height="0.12" material="shader: flat;"
                animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true">
            </a-image>

            <!-- Keystone / White Water / Brush Creek -->
            <a-image src="#markerImage" position="0.35 -0.38 0.03"
                width="0.12" height="0.12" material="shader: flat;"
                animation="property: scale; to: 1.15 1.15 1.15; dir: alternate; dur: 900; loop: true">
            </a-image>

        </a-entity>

        <!-- Close-up targets: finding one of these opens that area's menu -->
        <a-entity id="subTarget1" mindar-image-target="targetIndex: 1"></a-entity>
        <a-entity id="subTarget2" mindar-image-target="targetIndex: 2"></a-entity>
        <a-entity id="subTarget3" mindar-image-target="targetIndex: 3"></a-entity>
        <a-entity id="subTarget4" mindar-image-target="targetIndex: 4"></a-entity>
        <a-entity id="subTarget5" mindar-image-target="targetIndex: 5"></a-entity>
        <a-entity id="subTarget6" mindar-image-target="targetIndex: 6"></a-entity>

    </a-scene>

    <!-- Loaded last so every element above already exists when it runs -->
    <script src="script.js"></script>
</body>
</html>
